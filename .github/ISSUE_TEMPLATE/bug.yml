name: 缺陷
description: 报告一个可复现的问题
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请先搜索已有 Issue。不要粘贴主机地址、口令、跳板令牌或密钥。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置页中的版本号，例如 0.5.8
      placeholder: 0.5.8
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 按顺序写出操作
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
